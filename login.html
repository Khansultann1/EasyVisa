<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>EasyVisa Login</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    width:350px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="box">

<h2>EasyVisa CRM</h2>

<input
id="username"
placeholder="Логин">

<input
id="password"
type="password"
placeholder="Пароль">

<button onclick="login()">

Кіру

</button>

</div>

<script>

async function login(){

const response=await fetch("/api/auth/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:document.getElementById("username").value,

password:document.getElementById("password").value

})

});

const data=await response.json();

if(data.success){

location.href="/admin";

}else{

alert("Логин немесе пароль қате");

}

}

</script>

</body>
</html>
