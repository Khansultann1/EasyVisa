services:
  - type: web
    name: nextvisa-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: MANAGER_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
